<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Responsivo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <section id="login">
            <div>
                <img src="imagens/imagem.jpg" alt="">
            </div>
            <div id="login-form">
                <h1>Login</h1>
                <p>Seja Bem-Vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente</p>
                <form action="login.php" method="post">
                    <label for="idnome"><span class="material-symbols-outlined">person</span></label>
                    <input type="text" id="idnome" placeholder="Seu nome">
                    <br>
                    <label for="idsenha"><span class="material-symbols-outlined">key</span></label>
                    <input type="password" id="idsenha" placeholder="Sua senha">
                    <input type="text" id="identrar" placeholder="Entrar">
                    <input type="email" id="idesqueci" placeholder="Esqueci a senha">
                </form>
            </div>
        </section>
    </main>
</body>
</html>
